name: Build and release reusable OS

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'cypherpunklabs' }}
      GCP_IMAGE_BUCKET: ${{ vars.GCP_IMAGE_BUCKET || 'cypherpunklabs-hiro-images' }}
      GCP_IMAGE_PUBLISHER: ${{ vars.GCP_IMAGE_PUBLISHER || 'hiro-image-publisher@cypherpunklabs.iam.gserviceaccount.com' }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || 'projects/1069855069526/locations/global/workloadIdentityPools/hiro-image-publisher/providers/hiro-vm-image' }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate sources and release version
        run: |
          scripts/validate
          python3 -m unittest discover -s tests -v
      - name: Require a new version tag on main
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo '::error::This version already has a release. Published OS versions are not overwritten.'
            exit 1
          fi
      - name: Check GCP publication identity before building
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_IMAGE_PUBLISHER }}
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Install Google Cloud CLI
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: Confirm Google federation works before building
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: gcloud auth print-access-token > /dev/null
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Install Ubuntu archive signing roots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ubuntu-keyring
      - name: Check UEFI tooling before building
        run: nix develop --command python3 scripts/check-image-boot --preflight
      - name: Stage pinned OS helpers
        run: nix develop --command python3 scripts/stage-image
      - name: Build OS disk
        run: |
          nix develop --command bash -c 'sudo env PATH="$PATH" mkosi -C image build'
          sudo chown -R "$(id -u):$(id -g)" dist/image
      - name: Boot the base OS and check its runtime
        run: nix develop --command python3 scripts/check-image-boot
      - name: Package OS, measurement inputs and downstream release tools
        run: nix develop --command python3 scripts/package-image
      - name: Sign the OS manifest
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        id: signature
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: dist/publish/os-release.json
      - name: Verify signatures and artifact hashes
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          BUNDLE: ${{ steps.signature.outputs.bundle-path }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cp "$BUNDLE" dist/publish/os-release.sigstore.json
          gh attestation verify dist/publish/os-release.json --bundle dist/publish/os-release.sigstore.json \
            --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/image.yml" \
            --signer-digest "$GITHUB_WORKFLOW_SHA" --source-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" --predicate-type https://slsa.dev/provenance/v1 \
            --deny-self-hosted-runners
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            nix develop --command python3 scripts/select-os --verify-only \
              --repository "$GITHUB_REPOSITORY" --version "$RELEASE_TAG" --output dist/publish
          fi
          python3 -c 'import sys; sys.path.insert(0,"scripts"); from image_lib import checksums; checksums("dist/publish")'
      - name: Refresh Google publication credentials
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_IMAGE_PUBLISHER }}
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Upload and register the GCP custom image
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: python3 scripts/publish-gcp-image
      - name: Publish immutable versioned GitHub release
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/publish/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft --title "hiro-image $RELEASE_TAG" --generate-notes
          # Compare server-stored assets before making the release visible.
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir dist/published
          (cd dist/published && sha256sum --check SHA256SUMS)
          cmp dist/publish/SHA256SUMS dist/published/SHA256SUMS
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false "${prerelease[@]}"
      - name: Retain build artifacts
        if: success() && !(startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: h-image-${{ github.sha }}
          path: dist/publish/
          retention-days: 7
          compression-level: 0
      - name: Retain build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: h-image-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/boot*.log
            dist/boot-check.json
            dist/publish/*.json
            dist/image/*.manifest
          if-no-files-found: ignore
          retention-days: 14
